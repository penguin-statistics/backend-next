name: Test

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # disposable database for the repository integration tests (internal/repo/*_integration_test.go)
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # the toolchain the Dockerfile builds with
          go-version: "1.24.5"

      - name: Vet
        run: |
          go vet ./...
          go vet -tags workerbench ./internal/workers/calcwkr/

      # ./test holds end-to-end tests against a fully configured app and database, which CI does not have
      - name: Test
        env:
          PENGUIN_TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race -count=1 $(go list ./... | grep -v '/backend-next/test$')
