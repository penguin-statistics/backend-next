name: Test

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # disposable database for the repository integration tests (internal/repo/*_integration_test.go)
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # disposable Redis for the worker lock tests (internal/workers/calcwkr/lock_test.go)
      redis:
        image: redis:6.2.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # the toolchain the Dockerfile builds with
          go-version: "1.27.3"
          # setup-go v6+ keys the module cache on go.mod by default; keep keying it on go.sum
          cache-dependency-path: go.sum

      # disposable NATS with JetStream for the NATS integration tests; not a service container, as those cannot pass
      # the server its -js flag
      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js
          timeout 30 sh -c 'until nc -z 127.0.0.1 4222; do sleep 1; done'

      # the DuckDB postgres extension for the tests that read PostgreSQL through DuckDB (internal/pkg/duckdbx,
      # internal/coldstore); the app never installs extensions itself. Same download as the Dockerfile's duckdb-extensions stage: keep
      # DUCKDB_VERSION equal to its ARG DUCKDB_VERSION
      - name: Download DuckDB extensions
        env:
          DUCKDB_VERSION: v2.0.0
        # bash -eo pipefail, so that a failed download fails the step
        shell: bash
        run: |
          dir="$RUNNER_TEMP/duckdb-extensions/$DUCKDB_VERSION/linux_amd64"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "https://extensions.duckdb.org/$DUCKDB_VERSION/linux_amd64/postgres_scanner.duckdb_extension.gz" \
            | gunzip > "$dir/postgres_scanner.duckdb_extension"

      # backfill.sh's markers, resuming and upload checks, with a fake app binary and an rclone stub (a few seconds)
      - name: Test the cold storage backfill script
        run: scripts/coldstore/backfill_test.sh

      - name: Vet
        run: |
          go vet ./...
          go vet -tags workerbench ./internal/workers/calcwkr/ ./internal/service/
          go vet -tags compressbench ./internal/server/httpserver/

      # ./test holds end-to-end tests against a fully configured app and database, which CI does not have
      - name: Test
        env:
          PENGUIN_TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
          PENGUIN_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          PENGUIN_TEST_NATS_URL: nats://127.0.0.1:4222
          PENGUIN_TEST_DUCKDB_EXTENSION_DIR: ${{ runner.temp }}/duckdb-extensions
        run: go test -race -count=1 $(go list ./... | grep -v '/backend-next/test$')
